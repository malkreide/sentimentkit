name: CI

on:
  push:
    branches: [main, master]   # E5: Default-Branch ist nicht immer 'main'
  pull_request:
  workflow_dispatch:

# B5: Ohne diesen Block erbt der Workflow die Default-Berechtigungen des Repos.
# Je nach Alter und Organisation sind das 'read and write' — ein Job, der nur
# liest, bekommt dann ein Token, das pushen und Releases anlegen darf. Auf
# Workflow-Ebene setzen, nicht nur pro Job: sonst erbt jeder Job, der es nicht
# selbst ueberschreibt, weiterhin den Default.
permissions:
  contents: read

# B6: Ein neuer Push auf denselben PR macht den laufenden Job wertlos. Ohne
# diesen Block laufen beide zu Ende — und beide werden abgerechnet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # B6: Faengt Endlosschleifen und haengende Netzwerkaufrufe ab, bevor sie
    # das Minutenkontingent leeren. GitHubs Default sind 6 Stunden pro Job.
    timeout-minutes: 15
    steps:
      # B4: Actions sind auf den Commit-SHA gepinnt, nicht auf den Tag. Tags
      # sind verschiebbar — beim tj-actions/changed-files-Vorfall (Maerz 2025)
      # wurden die bestehenden Versions-Tags auf einen Backdoor-Commit
      # umgehaengt, und die abhaengigen Repos zogen ihn beim naechsten
      # regulaeren Lauf. Der Kommentar dahinter haelt lesbar, welche Version
      # der Hash ist; Dependabot zieht Hash und Kommentar gemeinsam nach.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # B1: Version EXAKT pinnen, nicht nur mit Obergrenze. Für `ruff check`
      # würde eine Obergrenze genügen, weil der Regelsatz in `select` steht.
      # `ruff format --check` unten hat kein `select` — dort ist das Ergebnis
      # selbst das Kriterium. Jede Version, die am Formatter etwas ändert,
      # macht damit unberührten Code rot, gleichzeitig in jedem Repo, das
      # diese Vorlage benutzt, zu einem Zeitpunkt, den niemand gewählt hat.
      #
      # Die Version steht NICHT hier, sondern in `requirements-lint.txt` des
      # Zielrepos (eine Zeile: `ruff==X.Y.Z`, §8.1). Eine Zahl in der Vorlage
      # veraltet still und wird mitkopiert — genau das ist passiert. Fehlt die
      # Datei, scheitert dieser Schritt laut, statt irgendein ruff zu nehmen.
      #
      # Seit 0.16.1 formatiert `ruff format` auch Python-Blöcke in Markdown; bis
      # 0.15.8 war das `preview`-only, `.md` blieb unberührt. Das Format-Gate
      # unten läuft über `.`, erfasst also ab dieser Version auch README, docs/
      # und CHANGELOG. Das ist meist erwünscht — wo nicht, gehört
      # `extend-exclude = ["*.md"]` in die ruff-Konfiguration des Zielrepos.
      # NICHT `exclude`: das ersetzt ruffs Vorgabeliste und holt `.venv/` und
      # `node_modules/` zurück ins Gate.
      - name: Install tooling
        run: python -m pip install -r requirements-lint.txt pytest

      # B1, zweite Hälfte: den Pin gegen das LAUFENDE Programm prüfen, nicht
      # zwei Texte gegeneinander — und zwar VOR den Gates, sonst stehen deren
      # Befunde schon im Log, bevor klar ist, welche Version sie erzeugt hat.
      # Ein älteres ruff weiter vorne im PATH oder eine still gescheiterte
      # Installation sind beide real vorgekommen.
      - name: Ruff version gate
        run: |
          want=$(sed -n 's/^ruff==\([0-9][0-9.]*\)[[:space:]]*$/\1/p' requirements-lint.txt)
          have=$(ruff --version | awk '{print $2}')
          if [ -z "$want" ]; then
            echo "::error::requirements-lint.txt pinnt ruff nicht exakt (erwartet: ruff==X.Y.Z)"
            exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::Pin ruff==$want, aber es läuft ruff $have"
            exit 1
          fi
          echo "ruff $have = Pin"

      # B2: Subprojekte erben die Wurzelkonfiguration NICHT — das stimmt, und es
      # ist der Grund, warum jedes Subprojekt seinen eigenen `select` braucht
      # (§8.2). Es ist aber NICHT der Grund für diese Schleife. Die Begründung,
      # die hier stand, war gemessen falsch:
      #
      # ruff löst Konfiguration pro Datei hierarchisch auf. Ein `ruff check .`
      # an der Wurzel wendet auf jede Datei bereits die nächstgelegene
      # pyproject.toml an — es implementiert die Nicht-Vererbung, statt an ihr
      # zu scheitern. Gemessen mit 0.15.8; Wurzel `select = ["F","I"]`,
      # Subprojekt `select = ["F"]` und `line-length = 50`:
      #
      #   * unsortierte Importe im Subprojekt: vom Wurzel-Lauf NICHT gemeldet
      #     (der Wurzel-`select` gilt dort nicht — Nicht-Vererbung bestätigt);
      #   * eine 52-Zeichen-Zeile im Subprojekt: vom Wurzel-Lauf SEHR WOHL
      #     gemeldet und auf 50 umbrochen — also mit der `line-length` des
      #     Subprojekts, nicht der der Wurzel.
      #
      # Eine mit abweichenden Regelsätzen oder Breiten begründete Schleife
      # fängt demnach nichts.
      #
      # Was sie fängt: ein `exclude` in der Wurzelkonfiguration, das das
      # Subprojekt abdeckt. Der Verzeichnislauf überspringt es dann
      # stillschweigend — exit 0, obwohl im Subprojekt Verstöße liegen —, der
      # `cd` unten findet sie. Kontrollgruppe ohne `exclude`: der Wurzel-Lauf
      # wird rot. Das ist die eine gemessene Lücke, und deshalb bleibt die
      # Schleife stehen.
      - name: Lint
        run: |
          ruff check .
          for sub in $(find . -mindepth 2 -name pyproject.toml -not -path "./.venv/*"); do
            echo "→ Lint $(dirname "$sub")"
            (cd "$(dirname "$sub")" && ruff check .)
          done

      # Zweites, eigenständiges Gate: Ein grünes `ruff check` belegt kein
      # grünes Format. Eigener Schritt, damit im Log steht, welches der beiden
      # Gates ausgelöst hat. Die Schleife je Subprojekt aus dem Grund, der oben
      # gemessen ist — dem `exclude`, nicht der `line-length`: die entscheidet
      # zwar je Verzeichnis, aber das tut sie im Wurzel-Lauf schon.
      - name: Format gate
        run: |
          ruff format --check .
          for sub in $(find . -mindepth 2 -name pyproject.toml -not -path "./.venv/*"); do
            echo "→ Format $(dirname "$sub")"
            (cd "$(dirname "$sub")" && ruff format --check .)
          done

      - name: Test
        run: pytest -q

      # Struktur- und Dokumentationsprüfung (C-, B-, E-Regeln).
      - name: Validate repository structure
        run: python scripts/validate_repo.py .

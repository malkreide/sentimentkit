# Ziel: .github/dependabot.yml — NICHT .github/workflows/. Liegt hier nur,
# weil das Bundle alle .github-Vorlagen an einem Ort haelt.
#
# B4 macht Pinning erst tragfaehig: gepinnte SHAs frieren sonst auf dem Stand
# des Tages ein, an dem das Repo entstand. Dependabot zieht Hash UND
# Versionskommentar gemeinsam nach, sodass die Zeile lesbar bleibt.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Ein PR pro Monat fuer alle Actions statt einer pro Action. Bei vielen
    # Repos ist die Zahl der PRs das eigentliche Problem, nicht ihr Inhalt:
    # was einzeln aufschlaegt, wird nicht gelesen, sondern weggeklickt.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # §8.1: Der ruff-Pin lebt in `requirements-lint.txt` des Zielrepos und
  # nirgends sonst. Dependabot schlägt einen neuen Pin als PR vor — die CI
  # dieses PRs IST die Messung, die §8.1 vor jedem Bump verlangt. Ein roter
  # Format-Gate-Lauf dort ist kein Defekt, sondern die Nachricht, dass die neue
  # Version anders formatiert: bewusst entscheiden, nicht blind mergen.
  #
  # `allow` beschränkt den Eintrag auf ruff. Ohne ihn schlüge Dependabot auch
  # Laufzeit-Abhängigkeiten aus pyproject.toml vor — ein anderes Thema mit
  # anderem Risiko, das hier nicht nebenbei mitlaufen soll.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: ruff
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps(dev)"

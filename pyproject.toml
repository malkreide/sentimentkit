[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentimentkit"
version = "0.1.0"
description = "Sentiment toolkit with swappable backends, evidence atoms, eval harness and policy-as-code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hayal Özkan" }]
keywords = ["sentiment-analysis", "nlp", "german", "evaluation", "governance", "claude-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: German",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  "click>=8.1,<9",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
encoder = ["transformers>=4.40", "torch"]
llm = ["httpx>=0.27"]

[project.scripts]
sentimentkit = "sentimentkit.cli:main"

[project.urls]
Homepage = "https://github.com/malkreide/sentimentkit"
Repository = "https://github.com/malkreide/sentimentkit"
Changelog = "https://github.com/malkreide/sentimentkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentimentkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
